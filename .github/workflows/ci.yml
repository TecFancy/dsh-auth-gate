name: CI

on:
  push:
    # development is the daily working branch — broken commits there should
    # fail CI immediately, not on the next merge to main.
    branches: [main, development]
  pull_request:

jobs:
  # Static/hygiene gates: fast, no build needed. Parallel purpose per job
  # (M3): failures surface in the owning job instead of a monolithic run.
  hygiene:
    name: hygiene (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lock:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:no-emdash
      - run: npm run slice:check
      - run: npm run decisions:check

  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:coverage

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bundle:check
      - name: Verify committed lib/ matches a fresh build
        run: git diff --exit-code -- lib
      # dsh installs this package into a profile with `npm install` (devDeps
      # omitted) — the guarded `prepare` script must not fail in that
      # environment (husky is a devDependency and is absent there). Simulate
      # the consumer flow on a fresh clone.
      - name: Verify consumer install (npm install --omit=dev in a fresh clone)
        shell: bash
        run: |
          tmp="$RUNNER_TEMP/consumer-install-test"
          rm -rf "$tmp"
          git clone --quiet "$GITHUB_WORKSPACE" "$tmp"
          cd "$tmp"
          npm install --omit=dev
